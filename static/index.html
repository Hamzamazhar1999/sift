<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>sift</title>
<link rel="icon" type="image/png" href="/static/icon.png">
<script>
  // Apply the theme before first paint to avoid a light-mode flash.
  (function () {
    var t = localStorage.getItem('sift.theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --accent: #d97757;
    --bg: #fafafa;
    --pane-bg: #ffffff;
    --border: #e5e5e5;
    --border-soft: #ececec;
    --text: #1a1a1c;
    --text-soft: #4a4a4d;
    --muted: #888;
    --code-bg: #f0eeea;
    --pageref-bg: #f0e9d3;
    --cite-bg: #fff7d6;
    --cite-bg-hover: #fff0a8;
    --cite-missing-bg: #f4f4f4;
    --cite-missing-border: #ddd;
    --thoughts-bg: #ffffff;
    --thoughts-hover: #f7f7f7;
    --thoughts-text: #555;
    --pdf-frame-bg: #4a4a4a;
    --pdf-bar-bg: #fafafa;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  [data-theme="dark"] {
    --accent: #e8895d;
    --bg: #18181a;
    --pane-bg: #1f1f22;
    --border: #38383d;
    --border-soft: #2c2c30;
    --text: #e8e8e9;
    --text-soft: #c0c0c3;
    --muted: #8c8c90;
    --code-bg: #2a2826;
    --pageref-bg: #3a342c;
    --cite-bg: #2a2620;
    --cite-bg-hover: #34302a;
    --cite-missing-bg: #232326;
    --cite-missing-border: #3a3a3e;
    --thoughts-bg: #1f1f22;
    --thoughts-hover: #2a2a2e;
    --thoughts-text: #b8b8bb;
    --pdf-frame-bg: #1a1a1c;
    --pdf-bar-bg: #1f1f22;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  body { display: flex; transition: background 0.15s, color 0.15s; }

  /* Left pane (PDF) */
  #left { flex: 1; min-width: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--pane-bg); }
  #left-bar { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; font-size: 13px; background: var(--pdf-bar-bg); color: var(--text-soft); }
  #left-bar select { flex: 1; padding: 5px 6px; background: var(--pane-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font: inherit; }
  #left-bar label { display: flex; gap: 5px; align-items: center; color: var(--muted); }
  /* Tell the PDF iframe to render in a light color scheme regardless of
     the surrounding theme — Chromium otherwise inverts PDFs in dark mode
     and that wrecks the yellow/pastel highlight colors we authored. */
  #pdf-frame { flex: 1; border: 0; width: 100%; background: var(--pdf-frame-bg); color-scheme: light; }
  .placeholder { padding: 40px; color: var(--muted); text-align: center; font-size: 13px; }

  /* Right pane (chat) */
  #right { width: 470px; flex-shrink: 0; display: flex; flex-direction: column; padding: 14px; gap: 10px; background: var(--pane-bg); min-width: 320px; }

  /* Drag handle between panes */
  #resizer { width: 5px; cursor: col-resize; background: var(--border); flex-shrink: 0; transition: background 0.12s; }
  #resizer:hover, #resizer.active { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing iframe { pointer-events: none; }  /* keep the iframe from eating mousemove */

  /* Brand header */
  #brand { display: flex; align-items: center; gap: 10px; padding-bottom: 4px; border-bottom: 1px solid var(--border-soft); margin-bottom: 2px; }
  #brand img { width: 32px; height: 32px; object-fit: contain; }
  #brand h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: -0.01em; font-weight: 600; }
  #theme-toggle { background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 13px; color: var(--text-soft); transition: background 0.1s; }
  #theme-toggle:hover { background: var(--bg); }

  /* Upload row */
  #upload-row { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  #upload-row input[type="file"] { flex: 1; min-width: 0; color: var(--text-soft); font: inherit; font-size: 12.5px; }
  #upload-row input[type="file"]::file-selector-button { background: var(--pane-bg); color: var(--text); border: 1px solid var(--border); padding: 5px 10px; border-radius: 4px; font: inherit; font-size: 12.5px; cursor: pointer; margin-right: 8px; }
  #upload-row input[type="file"]::file-selector-button:hover { background: var(--bg); }
  #upload-row #clear, #upload-row #clear-all { font-size: 12px; padding: 5px 10px; border: 1px solid var(--border); background: var(--pane-bg); border-radius: 4px; cursor: pointer; color: var(--text-soft); white-space: nowrap; }
  #upload-row #clear:hover:not(:disabled) { background: var(--cite-bg); color: var(--accent); border-color: var(--accent); }
  #upload-row #clear:disabled { opacity: 0.35; cursor: default; }
  #upload-row #clear-all:hover { background: #fde8e8; color: #c0392b; border-color: #c0392b; }
  [data-theme="dark"] #upload-row #clear-all:hover { background: #3a2020; color: #f08080; border-color: #f08080; }

  /* Log */
  #log { flex: 1; overflow-y: auto; background: var(--bg); padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13.5px; line-height: 1.5; color: var(--text); }
  #log .turn { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px dashed var(--border); }
  #log .turn:last-child { border-bottom: 0; }
  #log .q { font-weight: 600; margin-bottom: 6px; color: var(--text); }
  /* Rich answer typography — shared by chat turns and compare columns. */
  .answer { line-height: 1.55; color: var(--text); }
  .answer p { margin: 0 0 8px; }
  .answer p:last-child { margin-bottom: 0; }
  .answer ul, .answer ol { margin: 4px 0 8px; padding-left: 22px; }
  .answer li { margin: 2px 0; }
  .answer h1, .answer h2, .answer h3 { margin: 10px 0 4px; font-size: 14px; color: var(--text); }
  .answer code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; font-size: 12.5px; font-family: ui-monospace, Menlo, monospace; }
  .answer table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; display: block; max-width: 100%; overflow-x: auto; }
  .answer th, .answer td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; vertical-align: top; }
  .answer th { background: var(--code-bg); font-weight: 600; }
  .answer tbody tr:nth-child(even) td { background: var(--pane-bg); }
  .answer strong { font-weight: 600; }
  .answer a { color: var(--accent); }

  /* Inline page-ref pill. Base text follows the theme (readable on the
     themed --pageref-bg in both light and dark). When colorPageRefs paints
     a pastel highlight background, it also pins the text to dark inline,
     since the highlight palette is light in both themes. */
  .pageref { color: var(--text); cursor: pointer; font-weight: 500; padding: 1px 6px; border-radius: 4px; background: var(--pageref-bg); transition: filter 0.1s; }
  .pageref:hover { filter: brightness(0.92); text-decoration: underline; }
  .pageref.unmatched { color: var(--accent); background: transparent; padding: 0 1px; }
  .pageref + .pageref { margin-left: 3px; }  /* gap between split [3][4][5] pills */

  /* Thinking indicator */
  #log .thinking { color: var(--muted); font-size: 13px; font-style: italic; display: flex; align-items: baseline; gap: 2px; }
  #log .thinking .word { transition: opacity 0.25s ease; }
  #log .thinking .dots::after { content: '…'; animation: dots 1.4s steps(4, end) infinite; display: inline-block; min-width: 1em; }
  @keyframes dots { 0%,24% { content: '.'; } 25%,49% { content: '..'; } 50%,100% { content: '…'; } }

  #log .meta { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  #log .stats { color: var(--muted); font-size: 11.5px; margin-bottom: 4px; }

  /* Thoughts trail */
  #log .thoughts { font-size: 12px; color: var(--muted); margin: 4px 0 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--thoughts-bg); }
  #log .thoughts summary { cursor: pointer; user-select: none; padding: 6px 10px; list-style: none; display: flex; gap: 6px; align-items: center; }
  #log .thoughts summary::-webkit-details-marker { display: none; }
  #log .thoughts summary::before { content: '▸'; transition: transform 0.15s ease; display: inline-block; }
  #log .thoughts[open] summary::before { transform: rotate(90deg); }
  #log .thoughts summary:hover { color: var(--text); background: var(--thoughts-hover); }
  #log .thoughts .body { padding: 0 10px 6px 22px; border-top: 1px solid var(--border-soft); }
  #log .thoughts .entry { padding: 5px 0; white-space: pre-wrap; line-height: 1.4; }
  #log .thoughts .entry + .entry { border-top: 1px dashed var(--border-soft); }
  #log .thoughts .entry.tool { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
  #log .thoughts .entry.text { color: var(--thoughts-text); }

  /* Citations — shared by chat turns and compare columns. */
  .citations { margin-top: 10px; }
  .citations h4 { margin: 4px 0; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; }
  .citation { display: block; background: var(--cite-bg); border: 1px solid var(--border); border-left: 4px solid var(--accent); padding: 7px 10px; margin: 5px 0; border-radius: 4px; cursor: pointer; font-size: 12.5px; line-height: 1.4; color: var(--text); transition: background 0.1s; box-shadow: var(--shadow); }
  .citation:hover { background: var(--cite-bg-hover); }
  .citation .idx { font-weight: 700; color: var(--accent); margin-right: 5px; font-variant-numeric: tabular-nums; }
  .citation .pg { font-weight: 600; color: var(--accent); margin-right: 6px; }
  .citation.missing { background: var(--cite-missing-bg); border-color: var(--cite-missing-border); border-left-color: var(--muted); color: var(--muted); cursor: default; box-shadow: none; }

  /* Composer */
  #q { width: 100%; padding: 10px; resize: vertical; min-height: 72px; font: inherit; border: 1px solid var(--border); border-radius: 6px; background: var(--pane-bg); color: var(--text); }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  #ask-row { display: flex; gap: 10px; align-items: center; }
  #ask-row label { display: flex; gap: 5px; align-items: center; color: var(--muted); font-size: 12px; }
  #ask-row select { font-size: 12px; padding: 4px 6px; background: var(--pane-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-family: inherit; }
  #send { flex: 1; padding: 10px; background: var(--accent); color: white; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: filter 0.1s; }
  #send:hover:not(:disabled) { filter: brightness(1.05); }
  #send:disabled { opacity: 0.45; cursor: default; }

  /* Scrollbars (subtle) */
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #log::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* Tabs (Chat / Compare) */
  #tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
  #tabs button { flex: 1; padding: 8px 10px; background: transparent; border: 0; border-bottom: 2px solid transparent; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: -1px; }
  #tabs button:hover { color: var(--text); }
  #tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* View containers — only the active tab's view is shown. */
  #chat-view, #compare-view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  #right[data-tab="chat"]    #compare-view { display: none; }
  #right[data-tab="compare"] #chat-view    { display: none; }
  #right[data-tab="compare"] #clear        { display: none; }

  /* Compare controls */
  #compare-controls { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 10px; flex-shrink: 0; }
  #compare-controls .head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; }
  #compare-controls .head .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  #compare-pdfs { max-height: 120px; overflow-y: auto; border: 1px solid var(--border-soft); border-radius: 4px; padding: 6px 8px; background: var(--pane-bg); font-size: 12.5px; }
  #compare-pdfs label { display: flex; gap: 6px; align-items: center; padding: 2px 0; cursor: pointer; color: var(--text); }
  #compare-pdfs label:hover { color: var(--accent); }
  #compare-pdfs .none { color: var(--muted); font-size: 12px; padding: 4px 0; }
  #compare-q { width: 100%; padding: 8px; min-height: 52px; resize: vertical; font: inherit; font-size: 12.5px; border: 1px solid var(--border); border-radius: 4px; background: var(--pane-bg); color: var(--text); }
  #compare-q:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  #compare-cfg { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #compare-cfg label { display: flex; gap: 5px; align-items: center; color: var(--muted); font-size: 12px; }
  #compare-cfg select { font-size: 12px; padding: 4px 6px; background: var(--pane-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-family: inherit; }
  #compare-actions { display: flex; gap: 8px; align-items: center; }
  #compare-actions .spacer { flex: 1; }
  #compare-status { font-size: 11.5px; color: var(--muted); }
  #compare-go { font-size: 13px; padding: 7px 14px; background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 4px; cursor: pointer; font-weight: 600; }
  #compare-go:hover:not(:disabled) { filter: brightness(1.05); }
  #compare-go:disabled { opacity: 0.5; cursor: default; }

  /* Compare results — ONE synthesized answer per run; per-paper answers
     are tucked into a collapsible detail. */
  #compare-results { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  .compare-run { border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
  .compare-run > .run-head { display: flex; align-items: baseline; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .compare-run > .run-head .q { font-weight: 600; font-size: 13px; color: var(--text); flex: 1; min-width: 0; }
  .compare-run > .run-head .run-meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .compare-run > .run-head .compare-close { cursor: pointer; color: var(--muted); font-size: 16px; line-height: 14px; padding: 0 2px; }
  .compare-run > .run-head .compare-close:hover { color: var(--accent); }

  /* Synthesized cross-paper answer (primary content) */
  .compare-aggregate { padding: 12px; }
  .compare-aggregate .agg-status { color: var(--muted); font-size: 12.5px; font-style: italic; }
  .compare-aggregate > .answer { font-size: 13.5px; line-height: 1.55; }
  .compare-aggregate > .citations { margin-top: 10px; }

  /* Collapsible per-paper answers (same affordance as the chat thoughts trail) */
  details.compare-individual { border-top: 1px solid var(--border-soft); font-size: 12.5px; }
  details.compare-individual > summary { cursor: pointer; user-select: none; padding: 8px 12px; list-style: none; display: flex; gap: 6px; align-items: center; color: var(--muted); }
  details.compare-individual > summary::-webkit-details-marker { display: none; }
  details.compare-individual > summary::before { content: '▸'; transition: transform 0.15s ease; display: inline-block; }
  details.compare-individual[open] > summary::before { transform: rotate(90deg); }
  details.compare-individual > summary:hover { color: var(--text); }
  details.compare-individual > .body { padding: 0 12px 8px; }
  .compare-paper { padding: 8px 0; border-top: 1px dashed var(--border-soft); }
  .compare-paper:first-child { border-top: 0; }
  .compare-paper .paper-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 5px; }
  .compare-paper .paper-title { font-weight: 600; font-size: 12px; color: var(--text); word-break: break-all; flex: 1; min-width: 0; }
  .compare-paper .paper-tag { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .compare-paper .paper-tag .cached { color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-left: 6px; }
  .compare-paper .answer { font-size: 12px; line-height: 1.5; }
  .compare-paper .citation { font-size: 11.5px; padding: 5px 7px; margin: 3px 0; }
  .compare-paper .err { color: #c0392b; font-size: 12px; }
  .pending { color: var(--muted); font-size: 12px; font-style: italic; }
  .citation .src { color: var(--muted); font-weight: 400; font-size: 10.5px; margin-right: 6px; }
  #compare-results::-webkit-scrollbar { width: 8px; height: 8px; }
  #compare-results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div id="left">
  <div id="left-bar">
    <select id="pdf-select"><option value="">(no PDF loaded)</option></select>
    <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="show-highlighted"> highlighted</label>
  </div>
  <iframe id="pdf-frame" src="about:blank"></iframe>
</div>

<div id="resizer" title="Drag to resize"></div>

<div id="right" data-tab="chat">
  <header id="brand">
    <img src="/static/icon.png" alt="">
    <h1>sift</h1>
    <button id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">☾</button>
  </header>
  <div id="upload-row">
    <input type="file" id="upload" accept="application/pdf" multiple>
    <button id="clear-all" title="Delete ALL PDFs from sift">🗑 clear all</button>
    <button id="clear" title="Clear chat history for this PDF" disabled>↩ clear</button>
  </div>
  <div id="tabs">
    <button id="tab-chat" class="active" type="button">Chat</button>
    <button id="tab-compare" type="button">Compare</button>
  </div>

  <!-- CHAT TAB: single-PDF Q&A -->
  <div id="chat-view">
    <div id="log"><div class="placeholder">Upload or pick a PDF, then ask a question.</div></div>
    <textarea id="q" placeholder="Ask a question about the PDF… (Enter to send, Shift+Enter for newline)"></textarea>
    <div id="ask-row">
      <label style="font-size:12px;color:var(--muted)">model
        <select id="model"></select>
      </label>
      <label style="font-size:12px;color:var(--muted)">mode
        <select id="mode"></select>
      </label>
      <label style="font-size:12px;color:var(--muted)" title="Which CLI binary the agent spawns. `claude` = official Claude Code (Anthropic). `openclaude` = drop-in alternative that can route to OpenRouter / OpenAI / Gemini / etc. Configure the underlying provider in the chosen CLI itself.">backend
        <select id="backend"></select>
      </label>
      <button id="send" disabled>Ask</button>
    </div>
  </div>

  <!-- COMPARE TAB: one question across many PDFs, grouped per paper -->
  <div id="compare-view">
    <div id="compare-controls">
      <div class="head">Compare across PDFs <span class="hint">— same question sent to every selected PDF; answers cached server-side</span></div>
      <div id="compare-pdfs"></div>
      <textarea id="compare-q" placeholder="Question to ask each selected PDF…"></textarea>
      <div id="compare-cfg">
        <label>model <select id="compare-model"></select></label>
        <label>mode <select id="compare-mode"></select></label>
        <label>backend <select id="compare-backend"></select></label>
      </div>
      <div id="compare-actions">
        <span id="compare-status"></span>
        <span class="spacer"></span>
        <button id="compare-go" type="button">Ask selected</button>
      </div>
    </div>
    <div id="compare-results"><div class="placeholder">Pick PDFs and a question, then “Ask selected”. You get one synthesized answer across all of them.</div></div>
  </div>
</div>

<script>
const upload = document.getElementById('upload');
const select = document.getElementById('pdf-select');
const showHighlighted = document.getElementById('show-highlighted');
const pdfFrame = document.getElementById('pdf-frame');
const send = document.getElementById('send');
const q = document.getElementById('q');
const log = document.getElementById('log');
const modelSelect = document.getElementById('model');
const modeSelect = document.getElementById('mode');
const backendSelect = document.getElementById('backend');
const clearBtn = document.getElementById('clear');
const themeToggle = document.getElementById('theme-toggle');
// Tabs + compare view
const rightPane = document.getElementById('right');
const tabChatBtn = document.getElementById('tab-chat');
const tabCompareBtn = document.getElementById('tab-compare');
const comparePdfs = document.getElementById('compare-pdfs');
const compareQ = document.getElementById('compare-q');
const compareGo = document.getElementById('compare-go');
const compareStatus = document.getElementById('compare-status');
const compareResults = document.getElementById('compare-results');
const compareModelSelect = document.getElementById('compare-model');
const compareModeSelect = document.getElementById('compare-mode');
const compareBackendSelect = document.getElementById('compare-backend');

// --- tab switching ---
function setTab(tab) {
  rightPane.dataset.tab = tab;
  tabChatBtn.classList.toggle('active', tab === 'chat');
  tabCompareBtn.classList.toggle('active', tab === 'compare');
  localStorage.setItem('sift.tab', tab);
  if (tab === 'compare') refreshComparePdfs();
}
tabChatBtn.addEventListener('click', () => setTab('chat'));
tabCompareBtn.addEventListener('click', () => setTab('compare'));

// --- theme handling ---
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  // Show the icon of the theme you'd switch TO (sun in dark, moon in light)
  themeToggle.textContent = t === 'dark' ? '☀' : '☾';
}
applyTheme(localStorage.getItem('sift.theme') ||
  (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('sift.theme', next);
});

// --- right-pane resizer ---
(function () {
  const resizer = document.getElementById('resizer');
  const right = document.getElementById('right');
  const MIN_RIGHT = 320;
  const MIN_LEFT = 320;
  const saved = parseInt(localStorage.getItem('sift.right-width') || '0', 10);
  if (saved >= MIN_RIGHT) right.style.width = saved + 'px';

  let dragging = false;
  resizer.addEventListener('mousedown', e => {
    dragging = true;
    resizer.classList.add('active');
    document.body.classList.add('resizing');
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.max(MIN_RIGHT, Math.min(window.innerWidth - MIN_LEFT, window.innerWidth - e.clientX));
    right.style.width = w + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('active');
    document.body.classList.remove('resizing');
    localStorage.setItem('sift.right-width', parseInt(right.style.width, 10));
  });
  // Re-clamp on window resize so the right pane never exceeds the viewport
  window.addEventListener('resize', () => {
    const cur = parseInt(right.style.width, 10) || right.offsetWidth;
    const max = window.innerWidth - MIN_LEFT;
    if (cur > max) right.style.width = Math.max(MIN_RIGHT, max) + 'px';
  });
})();

function populate(sel, cfg, storageKey) {
  sel.innerHTML = '';
  for (const c of cfg.choices) {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    if (c === cfg.default) o.selected = true;
    sel.appendChild(o);
  }
  const saved = localStorage.getItem(storageKey);
  if (saved && cfg.choices.includes(saved)) sel.value = saved;
  sel.addEventListener('change', () => localStorage.setItem(storageKey, sel.value));
}

// Backend details (per-backend model lists + display labels). Captured
// from /config so we can repopulate the model dropdown when the user
// switches backends — different CLIs accept different model aliases.
let BACKEND_DETAILS = {};

function modelCfgFor(backendName) {
  const d = BACKEND_DETAILS[backendName];
  if (!d) return null;
  return { choices: d.models, default: d.default_model };
}

(async () => {
  const fallback = {
    models:   { choices: ['haiku', 'sonnet', 'opus', 'inherit'], default: 'haiku' },
    modes:    { choices: ['auto', 'strict', 'freehand'],         default: 'auto' },
    backends: {
      choices: ['claude', 'openclaude'],
      default: 'claude',
      details: {
        claude:     { models: ['haiku', 'sonnet', 'opus', 'inherit'], default_model: 'haiku' },
        openclaude: { models: ['inherit'],                            default_model: 'inherit' },
      },
    },
  };
  let j = fallback;
  try {
    const r = await fetch('/config');
    if (r.ok) {
      const data = await r.json();
      if (data && data.models && data.modes) j = { ...fallback, ...data };
    }
  } catch (_) { /* fall through to defaults */ }

  BACKEND_DETAILS = (j.backends && j.backends.details) || fallback.backends.details;
  populate(modeSelect, j.modes, 'sift.mode');
  populate(backendSelect, j.backends || fallback.backends, 'sift.backend');

  // Model choices follow the currently-selected backend. When the user
  // picks a different backend later, repopulate from BACKEND_DETAILS.
  const initialModelCfg = modelCfgFor(backendSelect.value) || j.models;
  populate(modelSelect, initialModelCfg, 'sift.model');

  backendSelect.addEventListener('change', () => {
    const cfg = modelCfgFor(backendSelect.value);
    if (cfg) populate(modelSelect, cfg, 'sift.model');
  });

  // The Compare tab has its own model/mode/backend selectors so a
  // comparison can use a different model than the chat tab. They share
  // the same localStorage keys so defaults line up across reloads.
  populate(compareModeSelect, j.modes, 'sift.mode');
  populate(compareBackendSelect, j.backends || fallback.backends, 'sift.backend');
  const cmpModelCfg = modelCfgFor(compareBackendSelect.value) || j.models;
  populate(compareModelSelect, cmpModelCfg, 'sift.model');
  compareBackendSelect.addEventListener('change', () => {
    const cfg = modelCfgFor(compareBackendSelect.value);
    if (cfg) populate(compareModelSelect, cfg, 'sift.model');
  });

  // Populate the PDF dropdown BEFORE applying the saved tab, so that if
  // the saved tab is "compare", refreshComparePdfs() (called by setTab)
  // sees a populated dropdown instead of the empty placeholder option.
  await refreshList();
  setTab(localStorage.getItem('sift.tab') || 'chat');
})();

// --- minimal markdown renderer (bold, italic, code, lists, headings, links) ---
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function inlineMd(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?;:]|$)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
// Walk text nodes under `root` and turn citation markers into clickable
// .pageref spans. Two formats are supported:
//   Numbered (current):  "[3]", "[3, 7]"   — N indexes into `passages`
//   Legacy (older runs): "(p. 4)", "(pp. 4, 7)" — N is a literal page
// For numbered refs we store dataset.indices = "[3,7]" (1-indexed passages).
// For legacy refs we store dataset.pages = "[4,7]" (raw page numbers).
// Page numbers for navigation are resolved later in colorPageRefs once we
// have the citation list to look the index up in.
function linkifyPageRefs(root) {
  const reNum = /\[\s*(\d+(?:\s*,\s*\d+)*)\s*\]/g;
  const reLegacy = /\((pp?\.?)\s*([\d][\d,\s–—\-]*)\)/g;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  for (let n; (n = walker.nextNode()); ) {
    if (n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('pageref')) continue;
    const v = n.nodeValue;
    reNum.lastIndex = 0; reLegacy.lastIndex = 0;
    if (reNum.test(v) || reLegacy.test(v)) nodes.push(n);
  }
  for (const node of nodes) {
    const s = node.nodeValue;
    // Find all matches from both regexes, then process in left-to-right order.
    const matches = [];
    let m;
    reNum.lastIndex = 0;
    while ((m = reNum.exec(s))) {
      matches.push({ kind: 'num', start: m.index, end: m.index + m[0].length, text: m[0],
        nums: m[1].split(/\s*,\s*/).map(x => parseInt(x, 10)).filter(Number.isFinite) });
    }
    reLegacy.lastIndex = 0;
    while ((m = reLegacy.exec(s))) {
      matches.push({ kind: 'pg', start: m.index, end: m.index + m[0].length, text: m[0],
        nums: m[2].split(/[,\s–—\-]+/).filter(Boolean).map(x => parseInt(x, 10)).filter(Number.isFinite) });
    }
    matches.sort((a, b) => a.start - b.start);
    // Drop overlaps (shouldn't really happen).
    const kept = [];
    let cur = -1;
    for (const mt of matches) {
      if (mt.start < cur) continue;
      kept.push(mt); cur = mt.end;
    }
    if (!kept.length) continue;
    const frag = document.createDocumentFragment();
    let last = 0;
    for (const mt of kept) {
      if (mt.start > last) frag.appendChild(document.createTextNode(s.slice(last, mt.start)));
      if (mt.kind === 'num') {
        // Split a bundled "[3, 4, 5]" into ONE pill per index so each gets
        // its own colour matching its PDF highlight (a single pill could
        // only show the first passage's colour, mismatching the others).
        mt.nums.forEach((n) => {
          const span = document.createElement('span');
          span.className = 'pageref';
          span.textContent = '[' + n + ']';
          span.dataset.indices = JSON.stringify([n]);
          frag.appendChild(span);
        });
      } else {
        const span = document.createElement('span');
        span.className = 'pageref';
        span.textContent = mt.text;
        span.dataset.pages = JSON.stringify(mt.nums);
        frag.appendChild(span);
      }
      last = mt.end;
    }
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}

// Color each .pageref span under `root` with its matching citation's color.
// Two paths:
//   Numbered refs (dataset.indices): direct lookup citations[N-1] — exact
//     1-to-1 mapping, no ambiguity.
//   Legacy page refs (dataset.pages): fall back to the old positional cycle
//     through citations on that page.
// This function also populates dataset.pages on numbered refs so the click
// handler can navigate to the right PDF page without a second lookup.
function colorPageRefs(root, citations) {
  const cites = citations || [];
  // Legacy bucketing — only used when we see (p. N)-style refs.
  const byPage = {};
  cites.forEach(c => {
    if (c.found === false || !c.color) return;
    (byPage[c.page] = byPage[c.page] || []).push(c);
  });
  const idx = {};  // per-page cycle counter (legacy path only)
  const refs = root.querySelectorAll('.pageref');
  for (const ref of refs) {
    if (ref.dataset.indices) {
      const indices = JSON.parse(ref.dataset.indices);
      const primary = cites[indices[0] - 1];
      if (primary && primary.found !== false && primary.color) {
        ref.style.backgroundColor = primary.color;
        ref.style.color = '#1a1a1c';  // dark text on the light pastel, both themes
        ref.classList.remove('unmatched');
      } else {
        ref.classList.add('unmatched');
        ref.style.backgroundColor = '';
        ref.style.color = '';  // fall back to themed .pageref/.unmatched color
      }
      // Resolve passage indices → page numbers so click navigation works.
      const pages = indices
        .map(i => cites[i - 1] && cites[i - 1].page)
        .filter(p => Number.isFinite(p));
      if (pages.length) ref.dataset.pages = JSON.stringify(pages);
      // Aggregated answers: remember which PDF this global citation came
      // from, so a pill click opens that paper (not the active chat PDF).
      if (primary && primary.file_id) ref.dataset.fileId = primary.file_id;
    } else {
      const pages = JSON.parse(ref.dataset.pages || '[]');
      const p = pages[0];
      const list = byPage[p];
      if (list && list.length) {
        const i = idx[p] || 0;
        const c = list[i % list.length];
        idx[p] = i + 1;
        ref.style.backgroundColor = c.color;
        ref.style.color = '#1a1a1c';  // dark text on the light pastel, both themes
        ref.classList.remove('unmatched');
      } else {
        ref.classList.add('unmatched');
        ref.style.backgroundColor = '';
        ref.style.color = '';  // fall back to themed .pageref/.unmatched color
      }
    }
  }
}

// Pipe-table helpers (GFM-style):
//   | h1 | h2 |
//   |----|---:|
//   | a  | b  |
function isTableSeparator(line) {
  if (!line) return false;
  const t = line.trim();
  if (!t.includes('|')) return false;
  const inner = t.replace(/^\||\|$/g, '');
  const cells = inner.split('|').map(c => c.trim());
  return cells.length > 0 && cells.every(c => /^:?-{2,}:?$/.test(c));
}
function parseTableRow(line) {
  const t = line.trim().replace(/^\||\|$/g, '');
  return t.split('|').map(c => c.trim());
}
function alignFromSep(cell) {
  const t = cell.trim();
  const left = t.startsWith(':');
  const right = t.endsWith(':');
  if (left && right) return 'center';
  if (right) return 'right';
  if (left) return 'left';
  return '';
}
function renderTable(headers, sepCells, rows) {
  const aligns = sepCells.map(alignFromSep);
  const styleFor = i => aligns[i] ? ` style="text-align:${aligns[i]}"` : '';
  const head = '<thead><tr>' +
    headers.map((h, k) => `<th${styleFor(k)}>${inlineMd(h)}</th>`).join('') +
    '</tr></thead>';
  const body = '<tbody>' +
    rows.map(r =>
      '<tr>' + r.map((c, k) => `<td${styleFor(k)}>${inlineMd(c)}</td>`).join('') + '</tr>'
    ).join('') + '</tbody>';
  return `<table>${head}${body}</table>`;
}

function renderMarkdown(text) {
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.+)$/))) {
      const h = Math.min(6, m[1].length + 1);
      out.push(`<h${h}>${inlineMd(m[2])}</h${h}>`);
      i++;
    } else if (
      line.trim().includes('|') &&
      i + 1 < lines.length &&
      isTableSeparator(lines[i + 1])
    ) {
      const headers = parseTableRow(line);
      const sepCells = parseTableRow(lines[i + 1]);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim().includes('|') && lines[i].trim() !== '') {
        rows.push(parseTableRow(lines[i]));
        i++;
      }
      out.push(renderTable(headers, sepCells, rows));
    } else if (line.match(/^\s*[-*]\s+/)) {
      const items = [];
      while (i < lines.length && lines[i].match(/^\s*[-*]\s+/)) {
        items.push(`<li>${inlineMd(lines[i].replace(/^\s*[-*]\s+/, ''))}</li>`);
        i++;
      }
      out.push(`<ul>${items.join('')}</ul>`);
    } else if (line.match(/^\s*\d+\.\s+/)) {
      const items = [];
      while (i < lines.length && lines[i].match(/^\s*\d+\.\s+/)) {
        items.push(`<li>${inlineMd(lines[i].replace(/^\s*\d+\.\s+/, ''))}</li>`);
        i++;
      }
      out.push(`<ol>${items.join('')}</ol>`);
    } else if (line.trim() === '') {
      i++;
    } else {
      const para = [];
      while (
        i < lines.length &&
        lines[i].trim() !== '' &&
        !lines[i].match(/^\s*([-*]|\d+\.)\s+|^#{1,6}\s+/) &&
        !(lines[i].trim().includes('|') && i + 1 < lines.length && isTableSeparator(lines[i + 1]))
      ) {
        para.push(lines[i]);
        i++;
      }
      out.push(`<p>${inlineMd(para.join(' '))}</p>`);
    }
  }
  return out.join('');
}

let fileId = null;
let hasHighlighted = false;

function pdfUrl(page) {
  if (!fileId) return 'about:blank';
  const params = new URLSearchParams();
  if (showHighlighted.checked && hasHighlighted) params.set('highlighted', 'true');
  // bust iframe cache so re-running re-renders the new highlighted file
  params.set('t', Date.now());
  let u = '/pdf/' + encodeURIComponent(fileId) + '?' + params.toString();
  if (page) u += '#page=' + page;
  return u;
}

function reloadFrame(page) {
  pdfFrame.src = pdfUrl(page);
}

async function refreshList(selected) {
  const r = await fetch('/pdfs');
  const j = await r.json();
  select.innerHTML = '<option value="">(pick a PDF)</option>';
  for (const f of j.files) {
    const o = document.createElement('option');
    o.value = f; o.textContent = f;
    if (f === selected) o.selected = true;
    select.appendChild(o);
  }
  // Keep the Compare tab's PDF checklist in step with the dropdown.
  refreshComparePdfs();
}

function loadFile(name) {
  fileId = name;
  hasHighlighted = false;
  showHighlighted.checked = false;
  reloadFrame();
  send.disabled = !fileId;
  // Reset chat panel and rehydrate history for this PDF — but preserve
  // any compare results already rendered (they're cross-PDF, not tied to
  // the currently-selected file). loadHistory does the selective wipe.
  loadHistory(/*loading=*/true);
}

// Clear the chat log (per-PDF turns + placeholder). Compare results live
// in a separate container (#compare-results), so they're untouched here.
function clearChatTurnsOnly() {
  log.querySelectorAll('.turn, .placeholder').forEach(n => n.remove());
}

// Show the chat placeholder, unless there's already an active chat turn.
function setPlaceholder(text) {
  log.querySelectorAll('.placeholder').forEach(n => n.remove());
  if (!text) return;
  if (log.querySelector('.turn')) return;  // active per-PDF chat — skip
  log.appendChild(el('div', 'placeholder', text));
}

function renderPastTurn(t, turnIdx) {
  const turn = turnEl();
  turn.dataset.turnIdx = String(turnIdx);
  turn.appendChild(el('div', 'q', 'Q: ' + t.question));
  const answer = el('div', 'answer');
  answer.innerHTML = renderMarkdown(t.answer || '');
  linkifyPageRefs(answer);
  turn.appendChild(answer);
  const cites = t.citations || [];
  if (cites.length) {
    const box = el('div', 'citations');
    box.appendChild(el('h4', null, 'Citations'));
    cites.forEach((c, i) => buildCitationChip(c, box, turnIdx, i));
    turn.appendChild(box);
  }
  colorPageRefs(answer, cites);
  log.appendChild(turn);
}

function buildCitationChip(c, box, turnIdx, index) {
  const cite = el('div', 'citation' + (c.found === false ? ' missing' : ''));
  if (c.color) cite.style.borderLeftColor = c.color;
  if (Number.isInteger(index)) cite.appendChild(el('span', 'idx', '[' + (index + 1) + ']'));
  cite.appendChild(el('span', 'pg', 'p.' + c.page));
  // Aggregated (cross-paper) citations carry their source file_id: show the
  // paper name and remember it so a click opens the right PDF.
  if (c.file_id) {
    cite.appendChild(el('span', 'src', c.file_id.replace(/\.pdf$/i, '')));
    cite.dataset.fileId = c.file_id;
  }
  cite.appendChild(document.createTextNode(c.quote));
  cite.dataset.page = String(c.page);
  // Per-PDF chat chips know their turnIdx; compare chips resolve context via
  // closest() in openCitation(), so we don't bind anything here directly.
  if (Number.isInteger(turnIdx)) cite.dataset.turnIdx = String(turnIdx);
  box.appendChild(cite);
}

// Load the highlighted PDF rendered specifically for `turnIdx` (the
// citations from that past turn) and jump to `page`. Falls back to the
// latest-turn highlighted PDF when turnIdx is undefined.
function loadTurnPdf(turnIdx, page) {
  if (!fileId) return;
  showHighlighted.checked = true;
  hasHighlighted = true;
  const params = new URLSearchParams();
  if (Number.isInteger(turnIdx)) params.set('turn', String(turnIdx));
  else params.set('highlighted', 'true');
  params.set('t', Date.now());
  let u = '/pdf/' + encodeURIComponent(fileId) + '?' + params.toString();
  if (page) u += '#page=' + page;
  pdfFrame.src = u;
}

// Compare-column chip / pill click: open a *specific* PDF (which may not
// be the currently-loaded one) on the LEFT pane at `page`, highlighted
// using the citations captured by the named /ask-multi run. The compare
// results themselves (right pane) are untouched — only the left PDF and
// the chat tab's current file change.
function loadComparePdf(fid, page, runId) {
  if (!fid) return;
  if (fid !== fileId) {
    select.value = fid;
    fileId = fid;
    hasHighlighted = true;
    send.disabled = false;
    // Rehydrate the Chat tab for the newly-selected PDF (lazily; it's
    // hidden while the Compare tab is active).
    clearChatTurnsOnly();
    loadHistory(/*loading=*/false);
  }
  showHighlighted.checked = true;
  hasHighlighted = true;
  const params = new URLSearchParams();
  params.set('cmp', runId);
  params.set('t', Date.now());
  let u = '/pdf/' + encodeURIComponent(fid) + '?' + params.toString();
  if (page) u += '#page=' + page;
  pdfFrame.src = u;
}

// Total turns currently rendered in the chat for the active PDF — used as
// the next live turn's index when /ask completes. Reset on file switch.
let turnCount = 0;

async function loadHistory(loading) {
  // Wipe the prior PDF's chat turns before rehydrating this one's.
  clearChatTurnsOnly();
  if (loading) setPlaceholder('Loading…');

  if (!fileId) { clearBtn.disabled = true; turnCount = 0; setPlaceholder('Upload or pick a PDF, then ask a question.'); return; }
  let turns = [];
  try {
    const r = await fetch('/history/' + encodeURIComponent(fileId));
    if (r.ok) turns = (await r.json()).turns || [];
  } catch {}
  // Always re-clear in case anything was added between the two awaits
  clearChatTurnsOnly();
  if (!turns.length) {
    setPlaceholder('Ask a question about this PDF.');
    clearBtn.disabled = true;
    turnCount = 0;
    return;
  }
  turns.forEach((t, i) => renderPastTurn(t, i));
  turnCount = turns.length;
  clearBtn.disabled = false;
  // Past turns may have generated a highlighted PDF; check if it exists.
  fetch('/pdf/' + encodeURIComponent(fileId) + '?highlighted=true', { method: 'HEAD' })
    .then(r => { if (r.ok) hasHighlighted = true; })
    .catch(() => {});
}

clearBtn.addEventListener('click', async () => {
  if (!fileId) return;
  if (!confirm('Clear chat history for this PDF?')) return;
  await fetch('/clear/' + encodeURIComponent(fileId), { method: 'POST' });
  clearChatTurnsOnly();
  setPlaceholder('Cleared. Ask a new question.');
  clearBtn.disabled = true;
  // Reset turn counter so the next live turn maps to CHATS[0] server-side
  // — without this, ?turn=N requests look up an index that no longer exists.
  turnCount = 0;
  hasHighlighted = false;
  showHighlighted.checked = false;
  reloadFrame();
});

upload.addEventListener('change', async () => {
  const files = Array.from(upload.files || []);
  if (!files.length) return;
  let firstId = null;
  for (const f of files) {
    const fd = new FormData();
    fd.append('file', f);
    try {
      const r = await fetch('/upload', { method: 'POST', body: fd });
      if (r.ok) { const j = await r.json(); firstId = firstId || j.file_id; }
    } catch (_) { /* skip this file, keep going */ }
  }
  upload.value = '';                 // allow re-selecting the same files later
  await refreshList(firstId);        // also refreshes the compare checklist
  if (firstId) loadFile(firstId);    // open the first uploaded PDF
});

const clearAllBtn = document.getElementById('clear-all');
clearAllBtn.addEventListener('click', async () => {
  if (!confirm('Delete ALL PDFs from sift? This removes every uploaded/fetched PDF and all chats. This cannot be undone.')) return;
  try {
    await fetch('/pdfs/clear-all', { method: 'POST' });
  } catch (_) {}
  fileId = null;
  hasHighlighted = false;
  showHighlighted.checked = false;
  clearChatTurnsOnly();
  setPlaceholder('Upload or pick a PDF, then ask a question.');
  // Clear any compare results too (their PDFs are gone).
  compareResults.innerHTML = '<div class="placeholder">Pick PDFs and a question, then “Ask selected”. You get one synthesized answer across all of them.</div>';
  clearBtn.disabled = true;
  send.disabled = true;
  reloadFrame();
  await refreshList();   // empties the dropdown + compare checklist
});

select.addEventListener('change', () => {
  if (select.value) loadFile(select.value);
});

showHighlighted.addEventListener('change', () => reloadFrame());

// Delegated click handler for the chat log: routes citation chips and
// inline pageref pills to openCitation(). (Compare results live in their
// own container with a separate handler — see the Compare section.)
log.addEventListener('click', e => {
  const chip = e.target.closest('.citation');
  if (chip && !chip.classList.contains('missing')) return openCitation(chip);
  const ref = e.target.closest('.pageref');
  if (ref && !ref.classList.contains('unmatched')) return openCitation(ref);
});

// Open the PDF associated with `node` (a .citation chip or .pageref
// pill) at its page. Two paths:
//   1) Inside a .compare-run → swap the LEFT pane to the citation's PDF
//      and load the compare-run highlights via /pdf/<fid>?cmp=<runId>.
//   2) Otherwise (per-PDF chat) → use existing turn-based highlights.
function openCitation(node) {
  // Page comes from either .dataset.pages (for pills) or .dataset.page
  // (for chips); both are populated when the node is built.
  let page = 0;
  if (node.dataset.pages) {
    const ps = JSON.parse(node.dataset.pages);
    if (ps && ps.length) page = ps[0];
  } else if (node.dataset.page) {
    page = parseInt(node.dataset.page, 10);
  }
  // Inside a comparison run: the run_id comes from the .compare-run; the
  // file_id comes either from the citation node itself (aggregated answer,
  // where each global citation is tagged) or from the enclosing per-paper
  // section's data-file-id.
  const runEl = node.closest('.compare-run');
  if (runEl) {
    const rid = runEl.dataset.runId;
    const owner = node.dataset.fileId ? node : node.closest('[data-file-id]');
    const fid = node.dataset.fileId || (owner && owner.dataset.fileId);
    if (fid && rid) return loadComparePdf(fid, page, rid);
    return;
  }
  if (!fileId) return;
  const turnDom = node.closest('.turn');
  const idxStr = turnDom && turnDom.dataset.turnIdx;
  const turnIdx = idxStr != null && idxStr !== '' ? parseInt(idxStr, 10) : undefined;
  loadTurnPdf(turnIdx, page);
}

// Generic Claude-style activity verbs. Never task-specific — we don't expose
// what the agent is actually doing.
const THINKING_WORDS = [
  'Pondering', 'Brewing', 'Cooking', 'Noodling', 'Hatching', 'Marinating',
  'Spelunking', 'Mulling', 'Whisking', 'Sleuthing', 'Combing', 'Reasoning',
  'Untangling', 'Distilling', 'Synthesizing', 'Excavating', 'Unraveling',
  'Considering', 'Crunching', 'Percolating', 'Ruminating', 'Cogitating',
  'Deliberating', 'Scheming', 'Puzzling', 'Tinkering', 'Foraging', 'Divining',
];

function pickThinkingWord(prev) {
  let w;
  do { w = THINKING_WORDS[Math.floor(Math.random() * THINKING_WORDS.length)]; }
  while (w === prev);
  return w;
}

function makeThinking() {
  const div = el('div', 'thinking');
  const word = el('span', 'word', pickThinkingWord());
  const dots = el('span', 'dots');
  div.appendChild(word);
  div.appendChild(dots);
  div._tick = setInterval(() => {
    word.style.opacity = '0';
    setTimeout(() => {
      word.textContent = pickThinkingWord(word.textContent);
      word.style.opacity = '1';
    }, 250);
  }, 2200);
  div._stop = () => clearInterval(div._tick);
  return div;
}

function turnEl() {
  const el = document.createElement('div');
  el.className = 'turn';
  return el;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// True when the element is scrolled to (or near) its bottom. Used to
// decide whether streaming updates should keep the view pinned to the
// bottom. If the user has scrolled UP to read, we leave them there
// instead of yanking the viewport down on every token.
function nearBottom(elem, px) {
  return elem.scrollHeight - elem.scrollTop - elem.clientHeight < (px == null ? 90 : px);
}

send.addEventListener('click', async () => {
  if (!fileId || !q.value.trim()) return;
  send.disabled = true;
  const question = q.value;
  q.value = '';

  // Remove the chat placeholder if present.
  log.querySelectorAll('.placeholder').forEach(n => n.remove());

  const turn = turnEl();
  const liveTurnIdx = turnCount;  // committed when the turn finishes
  turn.dataset.turnIdx = String(liveTurnIdx);
  turn.appendChild(el('div', 'q', 'Q: ' + question));
  const stats = el('div', 'stats', '');
  turn.appendChild(stats);
  const answer = el('div', 'answer', '');
  answer.style.display = 'none';
  turn.appendChild(answer);
  const meta = el('div', 'meta', '');
  turn.appendChild(meta);
  log.appendChild(turn);
  log.scrollTop = log.scrollHeight;

  const startMs = Date.now();
  const trail = [];  // [{kind: 'text'|'tool', content: string}]

  let answerRaw = '';
  let thinking = null;
  function showThinking() {
    if (thinking && thinking.isConnected) return;
    if (thinking && thinking._stop) thinking._stop();
    thinking = makeThinking();
    turn.insertBefore(thinking, answer);
    answer.style.display = 'none';
    answer.innerHTML = '';
    answerRaw = '';
  }
  function stopThinking() {
    if (thinking) {
      if (thinking._stop) thinking._stop();
      thinking.remove();
      thinking = null;
    }
  }
  showThinking();

  function needsSpace(prev, chunk) {
    if (!prev || !chunk) return false;
    const last = prev.slice(-1);
    const first = chunk[0];
    if (/\s/.test(last) || /\s/.test(first)) return false;
    if (/[.,;:!?)\]'"]/.test(first)) return false;
    return true;
  }

  let r;
  try {
    r = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file_id: fileId, question, model: modelSelect.value, mode: modeSelect.value, backend: backendSelect.value }),
    });
  } catch (e) {
    stopThinking();
    meta.textContent = 'request failed: ' + e;
    send.disabled = false;
    return;
  }

  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const events = buf.split('\n\n');
    buf = events.pop();
    for (const evt of events) {
      const line = evt.replace(/^data: /, '').trim();
      if (!line) continue;
      let m;
      try { m = JSON.parse(line); } catch { continue; }
      // Capture stickiness BEFORE this event mutates the DOM, so we only
      // re-pin to the bottom if the user was already there.
      const stick = nearBottom(log);
      if (m.type === 'text') {
        if (answer.style.display === 'none') {
          stopThinking();
          answer.style.display = '';
        }
        let chunk = m.data;
        if (needsSpace(answerRaw, chunk)) chunk = ' ' + chunk;
        answerRaw += chunk;
        answer.innerHTML = renderMarkdown(answerRaw);
        linkifyPageRefs(answer);
      } else if (m.type === 'stats') {
        const k = (m.data.char_count / 1000).toFixed(1);
        stats.textContent = `Loaded ${m.data.page_count} pages · ${k}k chars`;
      } else if (m.type === 'tool') {
        // The currently-visible text was thinking-out-loud — preserve it in
        // the trail, then reset the visible answer back to the indicator.
        // Only post-last-tool text sticks as the real answer.
        if (answerRaw.trim()) {
          trail.push({ kind: 'text', content: answerRaw.trim() });
        }
        trail.push({ kind: 'tool', content: m.data });
        showThinking();
      } else if (m.type === 'done') {
        stopThinking();
        clearBtn.disabled = false;
        if (trail.length) {
          const elapsed = ((Date.now() - startMs) / 1000).toFixed(1);
          const steps = trail.filter(e => e.kind === 'tool').length;
          const details = document.createElement('details');
          details.className = 'thoughts';
          const summary = document.createElement('summary');
          summary.textContent = `Thought for ${elapsed}s · ${steps} step${steps === 1 ? '' : 's'}`;
          details.appendChild(summary);
          const body = el('div', 'body');
          for (const e of trail) {
            const div = document.createElement('div');
            div.className = 'entry ' + e.kind;
            if (e.kind === 'text') {
              div.innerHTML = renderMarkdown(e.content);
              linkifyPageRefs(div);
            } else {
              div.textContent = e.content;
            }
            body.appendChild(div);
          }
          details.appendChild(body);
          turn.insertBefore(details, answer);
        }
        if (m.data.highlighted_pdf) {
          hasHighlighted = true;
          showHighlighted.checked = true;
          reloadFrame();
        }
        const cites = m.data.citations || [];
        if (cites.length) {
          const box = el('div', 'citations');
          box.appendChild(el('h4', null, 'Citations'));
          cites.forEach((c, i) => buildCitationChip(c, box, liveTurnIdx, i));
          turn.appendChild(box);
          colorPageRefs(answer, cites);
        }
        // Commit the new turn so subsequent past-turn lookups know it
        // exists in CHATS server-side.
        turnCount = liveTurnIdx + 1;
        if (m.data.cost_usd) {
          meta.textContent = `$${m.data.cost_usd.toFixed(4)}`;
        }
      } else if (m.type === 'error') {
        stopThinking();
        meta.textContent = 'ERROR: ' + m.data;
      }
      if (stick) log.scrollTop = log.scrollHeight;
    }
  }
  send.disabled = false;
});

q.addEventListener('keydown', e => {
  // Enter sends, Shift+Enter inserts a newline.
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (!send.disabled) send.click();
  }
});

// --- Compare across PDFs (its own tab) ---
// Results render into #compare-results, grouped BY PAPER into side-by-side
// columns. State lives entirely in the compare-view DOM, so switching the
// left PDF or the Chat tab never disturbs a comparison. Each run carries a
// server-side run_id; clicking a citation opens that paper on the LEFT
// pane with the run's highlights (see loadComparePdf).

// Rebuild the PDF checkbox list from the current dropdown, preserving any
// existing checks. Called when the Compare tab opens and after uploads.
function refreshComparePdfs() {
  const checked = new Set(
    Array.from(comparePdfs.querySelectorAll('input[type=checkbox]:checked')).map(c => c.value)
  );
  const hadAny = comparePdfs.querySelector('input[type=checkbox]') != null;
  comparePdfs.innerHTML = '';
  const opts = Array.from(select.options).filter(o => o.value);
  if (!opts.length) {
    comparePdfs.innerHTML = '<div class="none">No PDFs uploaded yet.</div>';
    return;
  }
  for (const o of opts) {
    const row = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = o.value;
    // Restore prior checks; on the very first build, pre-tick the loaded PDF.
    if (checked.has(o.value) || (!hadAny && checked.size === 0 && o.value === fileId)) {
      cb.checked = true;
    }
    row.appendChild(cb);
    row.appendChild(document.createTextNode(o.value));
    comparePdfs.appendChild(row);
  }
}

// Build one collapsed per-paper section (lives inside the "Per-paper
// answers" disclosure). data-file-id lets a citation click resolve which
// PDF to open; the run_id comes from the enclosing .compare-run.
function buildComparePaper(fid) {
  const sec = el('div', 'compare-paper');
  sec.dataset.fileId = fid;
  const head = el('div', 'paper-head');
  head.appendChild(el('span', 'paper-title', fid));
  head.appendChild(el('span', 'paper-tag', 'pending…'));
  sec.appendChild(head);
  const ans = el('div', 'answer');
  ans.appendChild(el('div', 'pending', 'waiting…'));
  sec.appendChild(ans);
  sec.appendChild(el('div', 'citations'));
  return sec;
}

// Restore the empty-state placeholder if no comparison runs remain.
function restoreComparePlaceholderIfEmpty() {
  if (!compareResults.querySelector('.compare-run')) {
    compareResults.innerHTML =
      '<div class="placeholder">Pick PDFs and a question, then “Ask selected”. You get one synthesized answer across all of them.</div>';
  }
}

// Remove a run node and restore the placeholder if it was the last one.
function removeCompareRun(run) {
  if (run) run.remove();
  restoreComparePlaceholderIfEmpty();
}

compareGo.addEventListener('click', async () => {
  const fileIds = Array.from(
    comparePdfs.querySelectorAll('input[type=checkbox]:checked')
  ).map(c => c.value);
  const question = compareQ.value.trim();
  if (!fileIds.length) { compareStatus.textContent = 'pick at least one PDF'; return; }
  if (!question)       { compareStatus.textContent = 'question required'; return; }
  const model = compareModelSelect.value;
  const mode = compareModeSelect.value;
  const backend = compareBackendSelect.value;

  compareGo.disabled = true;
  compareStatus.textContent = `running ${fileIds.length}…`;
  compareResults.querySelectorAll('.placeholder').forEach(n => n.remove());

  // --- run DOM: head, synthesized-answer area, collapsed per-paper area ---
  const run = el('div', 'compare-run');
  const head = el('div', 'run-head');
  head.appendChild(el('div', 'q', question));
  head.appendChild(el('div', 'run-meta',
    `${fileIds.length} PDF${fileIds.length === 1 ? '' : 's'} · ${model}/${mode}/${backend}`));
  const closer = el('span', 'compare-close', '×');
  closer.title = 'Dismiss this comparison';
  head.appendChild(closer);
  run.appendChild(head);

  // Synthesized cross-paper answer — the primary content.
  const agg = el('div', 'compare-aggregate');
  const aggStatus = el('div', 'agg-status',
    `Answering ${fileIds.length} paper${fileIds.length === 1 ? '' : 's'}…`);
  agg.appendChild(aggStatus);
  const aggAns = el('div', 'answer');
  aggAns.style.display = 'none';
  agg.appendChild(aggAns);
  const aggCites = el('div', 'citations');
  agg.appendChild(aggCites);
  run.appendChild(agg);

  // Per-paper answers, collapsed by default (toggle like the chat thoughts).
  const details = document.createElement('details');
  details.className = 'compare-individual';
  const summary = document.createElement('summary');
  summary.textContent = `Per-paper answers (${fileIds.length})`;
  details.appendChild(summary);
  const detBody = el('div', 'body');
  details.appendChild(detBody);
  const papers = {};
  for (const fid of fileIds) {
    const sec = buildComparePaper(fid);
    papers[fid] = sec;
    detBody.appendChild(sec);
  }
  run.appendChild(details);

  compareResults.insertBefore(run, compareResults.firstChild);

  // The × button cancels this run's in-flight stream; the loop treats the
  // resulting AbortError as a clean stop.
  const ctrl = new AbortController();
  run._abort = () => ctrl.abort();
  const setStatus = (t) => { if (run.isConnected) compareStatus.textContent = t; };
  const setAgg = (t) => { if (run.isConnected) { aggStatus.style.display = ''; aggStatus.textContent = t; } };

  let r;
  try {
    r = await fetch('/ask-multi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file_ids: fileIds, question, model, mode, backend }),
      signal: ctrl.signal,
    });
  } catch (e) {
    compareGo.disabled = false;
    if (!ctrl.signal.aborted) setStatus('request failed: ' + e);
    removeCompareRun(run);
    return;
  }
  if (!r.ok) {
    let msg = `HTTP ${r.status}`;
    try { msg = (await r.json()).detail || msg; } catch {}
    compareGo.disabled = false;
    setStatus('error: ' + msg);
    removeCompareRun(run);
    return;
  }

  const answerRaw = {};   // per-paper accumulated text
  const completed = new Set();
  let aggRaw = '';        // synthesized answer accumulated text
  let sawAgg = false;     // did any aggregate_* event arrive?
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const events = buf.split('\n\n');
      buf = events.pop();
      for (const evt of events) {
        const line = evt.replace(/^data: /, '').trim();
        if (!line) continue;
        let m;
        try { m = JSON.parse(line); } catch { continue; }

        if (m.type === 'multi_start') {
          if (m.data && m.data.run_id) run.dataset.runId = m.data.run_id;
          continue;
        }
        if (m.type === 'multi_done') {
          // If no PDF produced an answer, the server skips synthesis
          // entirely — finalize the (otherwise stuck) status line.
          if (!sawAgg) setAgg('No cross-paper synthesis — no paper produced an answer.');
          continue;
        }

        // ---- synthesized cross-paper answer ----
        if (m.type === 'aggregate_start') {
          sawAgg = true;
          aggRaw = '';
          setAgg('Synthesizing across papers…');
          continue;
        }
        if (m.type === 'aggregate_text') {
          sawAgg = true;
          aggRaw += m.data;
          aggStatus.style.display = 'none';
          aggAns.style.display = '';
          aggAns.innerHTML = renderMarkdown(aggRaw);
          linkifyPageRefs(aggAns);
          continue;
        }
        if (m.type === 'aggregate_done') {
          sawAgg = true;
          const cs = m.data.citations || [];
          aggRaw = m.data.answer || aggRaw || '';
          aggStatus.style.display = 'none';
          aggAns.style.display = '';
          aggAns.innerHTML = renderMarkdown(aggRaw);
          linkifyPageRefs(aggAns);
          aggCites.innerHTML = '';
          cs.forEach((c, i) => buildCitationChip(c, aggCites, undefined, i));
          colorPageRefs(aggAns, cs);
          continue;
        }
        if (m.type === 'aggregate_error') {
          // Drop any partially-streamed (and now unciteable) answer so we
          // don't show "failed" and a half answer at the same time.
          sawAgg = true;
          aggRaw = '';
          aggAns.innerHTML = '';
          aggAns.style.display = 'none';
          aggCites.innerHTML = '';
          setAgg('synthesis failed: ' + (m.data || 'unknown'));
          continue;
        }

        // ---- per-paper events (rendered into the collapsed detail) ----
        const fid = m.file_id;
        const sec = papers[fid];
        if (!sec) continue;
        const tag = sec.querySelector('.paper-tag');
        const ansEl = sec.querySelector('.answer');
        const citesEl = sec.querySelector('.citations');

        if (m.type === 'stats') {
          const k = (m.data.char_count / 1000).toFixed(1);
          tag.textContent = `${m.data.page_count} pages · ${k}k chars`;
        } else if (m.type === 'text') {
          answerRaw[fid] = (answerRaw[fid] || '') + m.data;
          ansEl.innerHTML = renderMarkdown(answerRaw[fid]);
          linkifyPageRefs(ansEl);
        } else if (m.type === 'tool') {
          answerRaw[fid] = '';
          ansEl.innerHTML = '<div class="pending">working…</div>';
        } else if (m.type === 'done') {
          const cs = m.data.citations || [];
          answerRaw[fid] = m.data.answer || answerRaw[fid] || '';
          ansEl.innerHTML = renderMarkdown(answerRaw[fid]);
          linkifyPageRefs(ansEl);
          citesEl.innerHTML = '';
          cs.forEach((c, i) => buildCitationChip(c, citesEl, undefined, i));
          colorPageRefs(ansEl, cs);
          const cost = m.data.cost_usd ? ` · $${m.data.cost_usd.toFixed(4)}` : '';
          tag.textContent = `${cs.length} cite${cs.length === 1 ? '' : 's'}${cost}`;
          if (m.data.cached) tag.appendChild(el('span', 'cached', 'cached'));
          completed.add(fid);
          setAgg(`Answered ${completed.size}/${fileIds.length} paper${fileIds.length === 1 ? '' : 's'}…`);
          setStatus(`${completed.size}/${fileIds.length} answered`);
        } else if (m.type === 'error') {
          ansEl.innerHTML = '';
          ansEl.appendChild(el('div', 'err', 'ERROR: ' + (m.data || 'unknown')));
          tag.textContent = 'error';
          completed.add(fid);
          setStatus(`${completed.size}/${fileIds.length} answered`);
        }
      }
    }
  } catch (e) {
    // Aborted via dismiss, or the stream dropped mid-flight — stop quietly.
  }
  compareGo.disabled = false;
  setStatus(run.isConnected ? 'done' : '');
});

// Click delegation for compare results: dismiss button, citation chips,
// and inline pageref pills all route here.
compareResults.addEventListener('click', e => {
  const closeBtn = e.target.closest('.compare-close');
  if (closeBtn) {
    const run = closeBtn.closest('.compare-run');
    if (run && run._abort) run._abort();   // cancel its stream if still running
    removeCompareRun(run);
    return;
  }
  const chip = e.target.closest('.citation');
  if (chip && !chip.classList.contains('missing')) return openCitation(chip);
  const ref = e.target.closest('.pageref');
  if (ref && !ref.classList.contains('unmatched')) return openCitation(ref);
});


// Initial PDF list load happens inside the /config IIFE (awaited before
// the saved tab is applied), so no separate refreshList() call is needed here.
</script>
